server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tripzy-backend
  config:
    # Loads secrets such as GEMINI_API_KEY from backend/.env (git-ignored) when present
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tripzy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:tripzySuperSecretSecureKeyWithAtLeast256BitsLengthForHmacSha256Verification!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_MODEL:gemini-3.8-flash}
    fallback-models: ${AI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-3.5-flash-lite}
  map:
    provider: openstreetmap

logging:
  level:
    com.tripzy: INFO
    org.springframework.security: WARN
